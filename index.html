<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo-dark.svg" />
    <meta name="theme-color" content="#0a1628" />
    <meta name="description" content="Lab for Autonomous Machines & IoT — Học tập, nghiên cứu và phát triển hệ thống nhúng, IoT, AI và bảo trì thông minh" />
    <title>Lab for Autonomous Machines & IoT</title>
  </head>
  <body>
    <!-- Form blueprint: Netlify scans static HTML at build time, even though React renders the visible Join Us form. -->
    <form name="join-us" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="join-us" />
      <input name="bot-field" type="text" />
      <input name="specialization" type="text" />
      <input name="name" type="text" />
      <input name="year" type="text" />
      <input name="phone" type="tel" />
      <input name="email" type="email" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
