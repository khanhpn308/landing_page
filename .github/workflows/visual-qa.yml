name: Visual QA snapshots

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'references/**'
      - 'package*.json'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      VITE_FORMSPREE_FORM_ID: qa-form-id
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install screenshot tooling
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Start Vite server
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Compare five references and mobile layouts
        run: python scripts/visual_qa.py --url http://127.0.0.1:5173
      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-screenshots
          path: artifacts/visual-qa/
          if-no-files-found: warn
